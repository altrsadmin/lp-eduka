name: Deploy to online

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite -> dist/)
        run: npm run build

      - name: Write VERSION
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=$TAG" > dist/VERSION
          echo "latest=true" >> dist/VERSION
          echo "deployed=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/VERSION

      - name: Deploy to branch online
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: online
          force_orphan: false
          commit_message: "Deploy ${{ github.ref_name }} [skip ci]"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
